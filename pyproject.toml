[project]
name = "mojo-pyclustering"
version = "0.1.0"
description = "Compute-intensive pyclustering algorithms implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "pyclustering", "clustering", "performance"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "pyclustering"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-pyclustering"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
